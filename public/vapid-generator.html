<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VAPID Key Generator</title>
</head>
<body style="font-family:Arial;padding:24px">
  <h2>Web Push VAPID Key Generator</h2>

  <button id="generate">Generate Keys</button>

  <h3>Public Key</h3>
  <textarea id="publicKey" rows="5" style="width:100%"></textarea>

  <h3>Private Key</h3>
  <textarea id="privateKey" rows="5" style="width:100%"></textarea>

  <script>
    function base64UrlToBytes(value) {
      const padded = value + "=".repeat((4 - value.length % 4) % 4);
      const base64 = padded.replace(/-/g, "+").replace(/_/g, "/");
      const binary = atob(base64);
      return Uint8Array.from(binary, c => c.charCodeAt(0));
    }

    function bytesToBase64Url(bytes) {
      let binary = "";
      bytes.forEach(b => binary += String.fromCharCode(b));
      return btoa(binary)
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/g, "");
    }

    document.getElementById("generate").onclick = async () => {
      const pair = await crypto.subtle.generateKey(
        {
          name: "ECDSA",
          namedCurve: "P-256"
        },
        true,
        ["sign", "verify"]
      );

      const publicJwk = await crypto.subtle.exportKey("jwk", pair.publicKey);
      const privateJwk = await crypto.subtle.exportKey("jwk", pair.privateKey);

      const x = base64UrlToBytes(publicJwk.x);
      const y = base64UrlToBytes(publicJwk.y);

      const rawPublic = new Uint8Array(65);
      rawPublic[0] = 4;
      rawPublic.set(x, 1);
      rawPublic.set(y, 33);

      document.getElementById("publicKey").value =
        bytesToBase64Url(rawPublic);

      document.getElementById("privateKey").value =
        privateJwk.d;
    };
  </script>
</body>
</html>
